[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev"]

[project]
name = "jev-calibration-testbed"
version = "0.1.0"
description = "A known-posterior synthetic testbed: a toy System One model and a calibration probe for TypeSafe's Jev."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.40",
    "sentencepiece>=0.2.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
